<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini-Twitter | CSE341 Lab 7</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #14171a;
    }

    header {
      background: #1da1f2;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      position: sticky; top: 0; z-index: 100;
    }
    header svg { width: 30px; height: 30px; fill: #fff; }
    header h1 { font-size: 1.3rem; font-weight: 700; }
    header span { font-size: .85rem; opacity: .85; margin-left: auto; }

    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }

    .tabs {
      display: flex; gap: 6px; margin-bottom: 24px;
      background: #fff; border-radius: 12px; padding: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .tab-btn {
      flex: 1; padding: 10px; border: none; border-radius: 8px;
      background: transparent; cursor: pointer; font-size: .92rem;
      font-weight: 600; color: #657786; transition: all .2s;
    }
    .tab-btn.active { background: #1da1f2; color: #fff; }
    .tab-btn:hover:not(.active) { background: #e8f5fd; color: #1da1f2; }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: #fff; border-radius: 14px; padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-bottom: 16px;
    }
    .card h2 { font-size: 1.05rem; margin-bottom: 14px; color: #1da1f2; }

    .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    input, textarea, select {
      flex: 1; min-width: 140px; padding: 9px 12px; border: 1.5px solid #ccd6dd;
      border-radius: 8px; font-size: .9rem; outline: none; transition: border .2s;
    }
    input:focus, textarea:focus, select:focus { border-color: #1da1f2; }
    textarea { resize: vertical; min-height: 70px; }

    .btn {
      padding: 9px 20px; border: none; border-radius: 8px;
      background: #1da1f2; color: #fff; font-weight: 700; cursor: pointer;
      font-size: .9rem; transition: background .2s; white-space: nowrap;
    }
    .btn:hover { background: #1a91da; }
    .btn.danger { background: #e0245e; }
    .btn.danger:hover { background: #cc1f54; }
    .btn.success { background: #17bf63; }
    .btn.success:hover { background: #14a854; }

    .feed { display: flex; flex-direction: column; gap: 14px; }

    .tweet-card {
      background: #fff; border-radius: 14px; padding: 16px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1); transition: box-shadow .2s;
    }
    .tweet-card:hover { box-shadow: 0 3px 12px rgba(0,0,0,.13); }

    .tweet-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: #1da1f2; color: #fff; display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 1.1rem; flex-shrink: 0;
    }
    .tweet-author { font-weight: 700; font-size: .95rem; }
    .tweet-time { font-size: .78rem; color: #657786; }
    .tweet-content { font-size: .95rem; line-height: 1.5; margin-bottom: 12px; }
    .tweet-actions { display: flex; gap: 16px; }
    .action-btn {
      display: flex; align-items: center; gap: 5px;
      background: none; border: none; color: #657786; cursor: pointer;
      font-size: .85rem; padding: 5px 8px; border-radius: 20px; transition: all .2s;
    }
    .action-btn:hover { color: #1da1f2; background: #e8f5fd; }
    .action-btn.liked { color: #e0245e; }
    .action-btn.liked:hover { background: #fde8ef; }
    .action-btn svg { width: 16px; height: 16px; }

    .user-card {
      background: #fff; border-radius: 14px; padding: 16px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1); display: flex;
      align-items: center; gap: 14px; margin-bottom: 12px;
    }
    .user-avatar {
      width: 50px; height: 50px; border-radius: 50%;
      background: linear-gradient(135deg,#1da1f2,#0d7bc9);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.3rem; flex-shrink: 0;
    }
    .user-info { flex: 1; }
    .user-name { font-weight: 700; font-size: 1rem; }
    .user-email { font-size: .82rem; color: #657786; margin-bottom: 4px; }
    .user-stats { display: flex; gap: 14px; font-size: .82rem; color: #657786; }
    .user-stats strong { color: #14171a; }

    .comment-item {
      padding: 10px 14px; background: #f7f9fa; border-radius: 10px; margin-bottom: 8px;
    }
    .comment-author { font-weight: 700; font-size: .85rem; margin-bottom: 3px; color: #1da1f2; }
    .comment-text { font-size: .88rem; }

    .response-box {
      background: #f0f7ff; border: 1.5px solid #b3d9f7; border-radius: 10px;
      padding: 12px; margin-top: 10px; font-size: .82rem;
      font-family: 'Courier New', monospace; white-space: pre-wrap; max-height: 180px;
      overflow-y: auto; color: #1a3a5c;
    }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: .75rem; font-weight: 700; background: #e8f5fd; color: #1da1f2;
    }

    .empty-state {
      text-align: center; padding: 40px; color: #657786;
    }
    .empty-state svg { width: 48px; height: 48px; fill: #ccd6dd; margin-bottom: 12px; }

    .section-title {
      font-size: .8rem; font-weight: 700; text-transform: uppercase;
      color: #657786; letter-spacing: .05em; margin-bottom: 12px;
    }

    .comments-section { margin-top: 14px; border-top: 1px solid #eee; padding-top: 12px; }

    @media (max-width: 600px) {
      .form-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<header>
  <svg viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>
  <h1>Mini-Twitter</h1>
  <span>CSE341 Lab 7 &mdash; Node.js &amp; Express</span>
</header>

<div class="container">

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('feed')">Feed</button>
    <button class="tab-btn" onclick="showTab('users')">Users</button>
    <button class="tab-btn" onclick="showTab('api')">API Console</button>
  </div>

  <!-- ─── FEED PANEL ─────────────────────────────────────────────────────── -->
  <div id="tab-feed" class="panel active">

    <!-- New Post -->
    <div class="card">
      <h2>New Post</h2>
      <div class="form-row">
        <select id="post-userId">
          <option value="">Select user...</option>
        </select>
      </div>
      <div class="form-row">
        <textarea id="post-content" placeholder="What's happening?"></textarea>
      </div>
      <button class="btn" onclick="createPost()">Tweet</button>
    </div>

    <!-- Posts Feed -->
    <div class="section-title">Timeline</div>
    <div id="feed" class="feed">
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>
        <p>No posts yet. Register a user and start tweeting!</p>
      </div>
    </div>
  </div>

  <!-- ─── USERS PANEL ────────────────────────────────────────────────────── -->
  <div id="tab-users" class="panel">

    <!-- Register -->
    <div class="card">
      <h2>Register User</h2>
      <div class="form-row">
        <input id="reg-username" placeholder="Username" />
        <input id="reg-email" placeholder="Email" type="email" />
        <button class="btn" onclick="registerUser()">Register</button>
      </div>
      <div id="reg-response" class="response-box" style="display:none"></div>
    </div>

    <!-- Follow -->
    <div class="card">
      <h2>Follow / Unfollow</h2>
      <div class="form-row">
        <select id="follow-from">
          <option value="">Follower...</option>
        </select>
        <select id="follow-to">
          <option value="">Follow whom...</option>
        </select>
        <button class="btn success" onclick="followUser()">Follow</button>
        <button class="btn danger" onclick="unfollowUser()">Unfollow</button>
      </div>
      <div id="follow-response" class="response-box" style="display:none"></div>
    </div>

    <!-- Users list -->
    <div class="section-title">Registered Users</div>
    <div id="users-list"></div>
  </div>

  <!-- ─── API CONSOLE PANEL ──────────────────────────────────────────────── -->
  <div id="tab-api" class="panel">
    <div class="card">
      <h2>API Console</h2>
      <div class="form-row">
        <select id="api-method" style="max-width:110px">
          <option>GET</option>
          <option>POST</option>
          <option>DELETE</option>
        </select>
        <input id="api-path" placeholder="/posts" />
        <button class="btn" onclick="sendApiRequest()">Send</button>
      </div>
      <div class="form-row">
        <textarea id="api-body" placeholder='Body JSON (for POST), e.g. {"userId":1,"content":"Hello!"}'></textarea>
      </div>
      <div class="section-title" style="margin-top:8px">Response</div>
      <div id="api-response" class="response-box">// Response will appear here</div>
    </div>

    <!-- Quick reference -->
    <div class="card">
      <h2>Endpoints Reference</h2>
      <table style="width:100%;border-collapse:collapse;font-size:.85rem">
        <thead>
          <tr style="background:#f0f7ff">
            <th style="padding:8px;text-align:left;border-bottom:2px solid #e1e8ed">Method</th>
            <th style="padding:8px;text-align:left;border-bottom:2px solid #e1e8ed">Endpoint</th>
            <th style="padding:8px;text-align:left;border-bottom:2px solid #e1e8ed">Description</th>
          </tr>
        </thead>
        <tbody id="endpoints-table"></tbody>
      </table>
    </div>
  </div>

</div><!-- /container -->

<script>
const BASE = "";

const ENDPOINTS = [
  { method:"POST",   path:"/users",                  desc:"Register a new user" },
  { method:"GET",    path:"/users",                  desc:"List all users" },
  { method:"GET",    path:"/users/:id",              desc:"Get user by ID" },
  { method:"POST",   path:"/users/:id/follow",       desc:"Follow a user  { followerId }" },
  { method:"DELETE", path:"/users/:id/follow",       desc:"Unfollow a user  { followerId }" },
  { method:"POST",   path:"/posts",                  desc:"Create a post  { userId, content }" },
  { method:"GET",    path:"/posts",                  desc:"Get all posts" },
  { method:"GET",    path:"/posts/:id",              desc:"Get post by ID" },
  { method:"DELETE", path:"/posts/:id",              desc:"Delete a post" },
  { method:"POST",   path:"/posts/:id/like",         desc:"Like a post  { userId }" },
  { method:"DELETE", path:"/posts/:id/like",         desc:"Unlike a post  { userId }" },
  { method:"POST",   path:"/posts/:id/comments",     desc:"Add a comment  { userId, content }" },
  { method:"GET",    path:"/posts/:id/comments",     desc:"Get comments for a post" },
];

const methodColor = { GET:"#17bf63", POST:"#1da1f2", DELETE:"#e0245e" };

// Build endpoints table
const tbody = document.getElementById("endpoints-table");
ENDPOINTS.forEach(e => {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td style="padding:7px 8px;border-bottom:1px solid #e1e8ed">
      <span style="background:${methodColor[e.method]};color:#fff;padding:2px 7px;border-radius:5px;font-weight:700;font-size:.78rem">${e.method}</span>
    </td>
    <td style="padding:7px 8px;border-bottom:1px solid #e1e8ed;font-family:monospace;color:#1a3a5c">${e.path}</td>
    <td style="padding:7px 8px;border-bottom:1px solid #e1e8ed;color:#657786">${e.desc}</td>
  `;
  tbody.appendChild(tr);
});

// ─── API helpers ──────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(BASE + path, opts);
  const data = await res.json().catch(() => ({}));
  return { status: res.status, data };
}

// ─── Users ────────────────────────────────────────────────────────────────────
async function registerUser() {
  const username = document.getElementById("reg-username").value.trim();
  const email = document.getElementById("reg-email").value.trim();
  if (!username || !email) return alert("Fill in username and email");
  const { status, data } = await api("POST", "/users", { username, email });
  const box = document.getElementById("reg-response");
  box.style.display = "block";
  box.textContent = `HTTP ${status}\n${JSON.stringify(data, null, 2)}`;
  if (status === 201) {
    document.getElementById("reg-username").value = "";
    document.getElementById("reg-email").value = "";
    refreshUsers();
    refreshFeed();
  }
}

async function refreshUsers() {
  const { data } = await api("GET", "/users");
  const list = document.getElementById("users-list");
  const selectors = ["post-userId","follow-from","follow-to"];

  // Update selects
  selectors.forEach(id => {
    const sel = document.getElementById(id);
    const cur = sel.value;
    sel.innerHTML = `<option value="">Select user...</option>`;
    data.forEach(u => {
      const opt = document.createElement("option");
      opt.value = u.id;
      opt.textContent = `@${u.username}`;
      sel.appendChild(opt);
    });
    sel.value = cur;
  });

  if (!data.length) {
    list.innerHTML = `<div class="empty-state"><p>No users yet. Register one above!</p></div>`;
    return;
  }
  list.innerHTML = data.map(u => `
    <div class="user-card">
      <div class="user-avatar">${u.username[0].toUpperCase()}</div>
      <div class="user-info">
        <div class="user-name">@${u.username}</div>
        <div class="user-email">${u.email}</div>
        <div class="user-stats">
          <span><strong>${u.followersCount}</strong> Followers</span>
          <span><strong>${u.followingCount}</strong> Following</span>
        </div>
      </div>
      <span class="badge">ID: ${u.id}</span>
    </div>
  `).join("");
}

async function followUser() {
  const followedId = document.getElementById("follow-to").value;
  const followerId = parseInt(document.getElementById("follow-from").value);
  if (!followedId || !followerId) return alert("Select both users");
  const { status, data } = await api("POST", `/users/${followedId}/follow`, { followerId });
  const box = document.getElementById("follow-response");
  box.style.display = "block";
  box.textContent = `HTTP ${status}\n${JSON.stringify(data, null, 2)}`;
  refreshUsers();
}

async function unfollowUser() {
  const followedId = document.getElementById("follow-to").value;
  const followerId = parseInt(document.getElementById("follow-from").value);
  if (!followedId || !followerId) return alert("Select both users");
  const { status, data } = await api("DELETE", `/users/${followedId}/follow`, { followerId });
  const box = document.getElementById("follow-response");
  box.style.display = "block";
  box.textContent = `HTTP ${status}\n${JSON.stringify(data, null, 2)}`;
  refreshUsers();
}

// ─── Posts ────────────────────────────────────────────────────────────────────
async function createPost() {
  const userId = parseInt(document.getElementById("post-userId").value);
  const content = document.getElementById("post-content").value.trim();
  if (!userId || !content) return alert("Select a user and write something");
  const { status } = await api("POST", "/posts", { userId, content });
  if (status === 201) {
    document.getElementById("post-content").value = "";
    refreshFeed();
  }
}

async function deletePost(id) {
  if (!confirm("Delete this post?")) return;
  await api("DELETE", `/posts/${id}`);
  refreshFeed();
}

async function toggleLike(postId, userId) {
  if (!userId) return alert("Select a user first in the Feed tab");
  const btn = document.getElementById(`like-btn-${postId}`);
  if (btn.classList.contains("liked")) {
    await api("DELETE", `/posts/${postId}/like`, { userId });
  } else {
    await api("POST", `/posts/${postId}/like`, { userId });
  }
  refreshFeed();
}

async function loadComments(postId) {
  const section = document.getElementById(`comments-${postId}`);
  if (section.style.display === "block") { section.style.display = "none"; return; }
  const { data } = await api("GET", `/posts/${postId}/comments`);
  const box = document.getElementById(`comments-list-${postId}`);
  box.innerHTML = data.length
    ? data.map(c => `
        <div class="comment-item">
          <div class="comment-author">@${c.author}</div>
          <div class="comment-text">${c.content}</div>
        </div>`).join("")
    : `<div style="color:#657786;font-size:.85rem">No comments yet.</div>`;
  section.style.display = "block";
}

async function addComment(postId) {
  const userId = parseInt(document.getElementById("post-userId").value);
  const input = document.getElementById(`comment-input-${postId}`);
  const content = input.value.trim();
  if (!userId || !content) return alert("Select a user in Feed tab and write a comment");
  await api("POST", `/posts/${postId}/comments`, { userId, content });
  input.value = "";
  loadComments(postId);
  refreshFeed();
}

async function refreshFeed() {
  const { data } = await api("GET", "/posts");
  const feed = document.getElementById("feed");

  if (!data.length) {
    feed.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>
      <p>No posts yet. Register a user and start tweeting!</p>
    </div>`;
    return;
  }

  feed.innerHTML = [...data].reverse().map(p => `
    <div class="tweet-card">
      <div class="tweet-header">
        <div class="avatar">${p.author[0].toUpperCase()}</div>
        <div>
          <div class="tweet-author">@${p.author}</div>
          <div class="tweet-time">${new Date(p.createdAt).toLocaleString()}</div>
        </div>
        <button class="action-btn danger" style="margin-left:auto" onclick="deletePost(${p.id})" title="Delete">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </button>
      </div>
      <div class="tweet-content">${p.content}</div>
      <div class="tweet-actions">
        <button id="like-btn-${p.id}" class="action-btn" onclick="toggleLike(${p.id}, parseInt(document.getElementById('post-userId').value))">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.638h-.014C9.403 21.59 1.95 14.856 1.95 8.478c0-3.064 2.525-5.754 5.403-5.754 2.29 0 3.83 1.58 4.646 2.73.814-1.148 2.354-2.73 4.645-2.73 2.88 0 5.404 2.69 5.404 5.755 0 6.376-7.454 13.11-10.037 13.157H12z"/></svg>
          ${p.likesCount}
        </button>
        <button class="action-btn" onclick="loadComments(${p.id})">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.046 2.242l-4.148-.01h-.002c-4.374 0-7.8 3.427-7.8 7.802 0 4.098 3.186 7.206 7.465 7.37v3.828c0 .108.044.286.12.403.142.225.376.34.298.34.14 0 .285-.07.39-.16.206-.18 2.047-1.74 3.29-3.063.37-.39.57-.64.62-.73.074-.127.12-.276.12-.427V9.792c0-4.375-3.426-7.55-7.652-7.55z"/></svg>
          ${p.commentsCount}
        </button>
      </div>
      <div id="comments-${p.id}" class="comments-section" style="display:none">
        <div id="comments-list-${p.id}"></div>
        <div class="form-row" style="margin-top:10px">
          <input id="comment-input-${p.id}" placeholder="Write a comment..." />
          <button class="btn" style="padding:9px 14px" onclick="addComment(${p.id})">Reply</button>
        </div>
      </div>
    </div>
  `).join("");
}

// ─── API Console ──────────────────────────────────────────────────────────────
async function sendApiRequest() {
  const method = document.getElementById("api-method").value;
  const path = document.getElementById("api-path").value.trim();
  const bodyText = document.getElementById("api-body").value.trim();
  let body;
  try { body = bodyText ? JSON.parse(bodyText) : undefined; }
  catch { return alert("Invalid JSON in body"); }

  const { status, data } = await api(method, path, body);
  const box = document.getElementById("api-response");
  box.textContent = `HTTP ${status}\n${JSON.stringify(data, null, 2)}`;

  // Refresh UI if state-changing
  if (["POST","DELETE"].includes(method)) { refreshFeed(); refreshUsers(); }
}

// ─── Tab navigation ───────────────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + name).classList.add("active");
  event.target.classList.add("active");
  if (name === "feed") refreshFeed();
  if (name === "users") refreshUsers();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
refreshFeed();
refreshUsers();
</script>
</body>
</html>
