<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Anas Bayoumy | 22p0011</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a35;
    --accent: #c8f060;
    --accent2: #60d4f0;
    --danger: #f06060;
    --text: #f0ede8;
    --muted: #7a7a8a;
    --done: #3a3a45;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 80px;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 28px 40px 24px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .brand h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    color: var(--accent);
    line-height: 1;
  }

  .brand .tagline {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .student-badge {
    text-align: right;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .student-badge .name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    color: var(--accent2);
    font-size: 0.85rem;
    display: block;
  }

  /* MAIN */
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  /* INPUT ZONE */
  .input-zone {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 28px;
    transition: border-color 0.2s;
  }

  .input-zone:focus-within {
    border-color: var(--accent);
  }

  .input-row {
    display: flex;
    gap: 12px;
  }

  #taskInput {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  #taskInput::placeholder { color: var(--muted); }

  #taskInput:focus {
    border-color: var(--accent);
    background: #1c1c22;
  }

  .btn-add {
    background: var(--accent);
    color: #0d0d0f;
    border: none;
    border-radius: 10px;
    padding: 14px 24px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
    white-space: nowrap;
  }

  .btn-add:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(200, 240, 96, 0.35);
  }

  .btn-add:active { transform: translateY(0); }

  /* CONTROLS */
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 28px;
    align-items: center;
  }

  .filter-group, .sort-group {
    display: flex;
    gap: 6px;
  }

  .filter-group { flex: 1; }

  .btn-filter {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.15s;
  }

  .btn-filter.active {
    background: var(--accent);
    color: #0d0d0f;
    border-color: var(--accent);
    font-weight: 500;
  }

  .btn-filter:hover:not(.active) {
    border-color: var(--muted);
    color: var(--text);
  }

  .sort-select {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }

  .sort-select:focus { border-color: var(--accent2); color: var(--text); }

  /* STATS */
  .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 24px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-num {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.4rem;
    color: var(--accent);
    line-height: 1;
  }

  .stat-num.done-num { color: var(--accent2); }
  .stat-num.pct-num { color: var(--muted); }

  .stat-label {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* TASK LIST */
  #taskList {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .task-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    animation: slideIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    transition: border-color 0.2s, opacity 0.3s, transform 0.3s;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-12px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .task-item.removing {
    opacity: 0;
    transform: translateX(30px) scale(0.95);
  }

  .task-item.done {
    border-color: var(--done);
    background: #141418;
  }

  .task-item:hover { border-color: #3a3a50; }

  /* Checkbox */
  .task-check {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    user-select: none;
  }

  .task-check:hover { border-color: var(--accent); transform: scale(1.1); }
  .done .task-check { background: var(--accent); border-color: var(--accent); }

  /* Task body */
  .task-body { flex: 1; min-width: 0; }

  .task-text {
    font-size: 0.9rem;
    color: var(--text);
    transition: color 0.2s;
    word-break: break-word;
  }

  .done .task-text {
    color: var(--muted);
    text-decoration: line-through;
  }

  .task-time {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-top: 4px;
  }

  /* Edit input */
  .task-edit-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    outline: none;
  }

  /* Action buttons */
  .task-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn-icon {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.15s;
    user-select: none;
  }

  .btn-icon:hover { transform: scale(1.15); border-color: var(--muted); }
  .btn-icon.btn-delete:hover { background: rgba(240,96,96,0.15); border-color: var(--danger); }
  .btn-icon.btn-edit:hover  { background: rgba(96,212,240,0.1); border-color: var(--accent2); }
  .btn-icon.btn-save:hover  { background: rgba(200,240,96,0.15); border-color: var(--accent); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-state .emoji { font-size: 3rem; display: block; margin-bottom: 16px; }
  .empty-state p { font-size: 0.85rem; letter-spacing: 0.05em; }

  /* Progress bar */
  .progress-bar-wrap {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 16px;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 24px;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }

  @media (max-width: 500px) {
    header { padding: 20px; flex-direction: column; align-items: flex-start; gap: 12px; }
    .student-badge { text-align: left; }
    .controls { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>TaskFlow</h1>
    <div class="tagline">Interactive Pro To-Do List · CSE343 Lab 4</div>
  </div>
  <div class="student-badge">
    <span class="name">Anas Bayoumy</span>
    22p0011
  </div>
</header>

<main>
  <!-- Input -->
  <div class="input-zone">
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="What needs to be done?" />
      <button class="btn-add" id="addBtn">+ Add Task</button>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <span class="stat-num" id="totalCount">0</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="stat">
      <span class="stat-num done-num" id="doneCount">0</span>
      <span class="stat-label">Done</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="pendingCount">0</span>
      <span class="stat-label">Pending</span>
    </div>
    <div class="stat" style="margin-left:auto">
      <span class="stat-num pct-num" id="pctCount">0%</span>
      <span class="stat-label">Progress</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="filter-group">
      <button class="btn-filter active" data-filter="all">All</button>
      <button class="btn-filter" data-filter="pending">Pending</button>
      <button class="btn-filter" data-filter="completed">Completed</button>
    </div>
    <div class="sort-group">
      <select class="sort-select" id="sortSelect">
        <option value="time-desc">⏱ Newest</option>
        <option value="time-asc">⏱ Oldest</option>
        <option value="alpha-asc">🔤 A → Z</option>
        <option value="alpha-desc">🔤 Z → A</option>
      </select>
    </div>
  </div>

  <!-- Task List -->
  <div id="taskList"></div>
</main>

<footer>CSE343 Web Development · Lab 4 · Anas Bayoumy · 22p0011</footer>

<script>
// ============================================================
// MODEL — Task data structure
// ============================================================
class Task {
  constructor(description) {
    this.id          = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    this.description = description.trim();
    this.completed   = false;
    this.createdAt   = new Date().toISOString();
  }
  toggle()   { this.completed = !this.completed; }
  edit(text) { this.description = text.trim(); }
}

// ============================================================
// MODEL — Task collection + persistence
// ============================================================
class TaskModel {
  constructor() {
    this.tasks = this._load();
  }
  _load() {
    try {
      const raw = localStorage.getItem('taskflow_22p0011');
      if (!raw) return [];
      return JSON.parse(raw).map(d => Object.assign(new Task(d.description), d));
    } catch { return []; }
  }
  _save() {
    localStorage.setItem('taskflow_22p0011', JSON.stringify(this.tasks));
  }
  add(description) {
    const t = new Task(description);
    this.tasks.push(t);
    this._save();
    return t;
  }
  remove(id) {
    this.tasks = this.tasks.filter(t => t.id !== id);
    this._save();
  }
  toggle(id) {
    const t = this.tasks.find(t => t.id === id);
    if (t) { t.toggle(); this._save(); }
  }
  edit(id, text) {
    const t = this.tasks.find(t => t.id === id);
    if (t) { t.edit(text); this._save(); }
  }
  getFiltered(filter, sort) {
    let list = [...this.tasks];
    if (filter === 'completed') list = list.filter(t => t.completed);
    if (filter === 'pending')   list = list.filter(t => !t.completed);
    if (sort === 'time-asc')    list.sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    if (sort === 'time-desc')   list.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    if (sort === 'alpha-asc')   list.sort((a, b) => a.description.localeCompare(b.description));
    if (sort === 'alpha-desc')  list.sort((a, b) => b.description.localeCompare(a.description));
    return list;
  }
}

// ============================================================
// VIEW — DOM rendering
// ============================================================
class TaskView {
  constructor() {
    this.listEl      = document.getElementById('taskList');
    this.inputEl     = document.getElementById('taskInput');
    this.addBtn      = document.getElementById('addBtn');
    this.filterBtns  = document.querySelectorAll('.btn-filter');
    this.sortSel     = document.getElementById('sortSelect');
    this.totalEl     = document.getElementById('totalCount');
    this.doneEl      = document.getElementById('doneCount');
    this.pendingEl   = document.getElementById('pendingCount');
    this.pctEl       = document.getElementById('pctCount');
    this.progressEl  = document.getElementById('progressBar');
  }

  renderList(tasks) {
    if (!tasks.length) {
      this.listEl.innerHTML = `
        <div class="empty-state">
          <span class="emoji">📋</span>
          <p>No tasks here yet. Start adding!</p>
        </div>`;
      return;
    }
    this.listEl.innerHTML = tasks.map(t => this._taskHTML(t)).join('');
  }

  _taskHTML(t) {
    const date = new Date(t.createdAt);
    const ts   = date.toLocaleDateString('en-GB', { day:'2-digit', month:'short' })
               + ' · ' + date.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    return `
    <div class="task-item${t.completed ? ' done' : ''}" data-id="${t.id}">
      <div class="task-check" data-action="toggle">${t.completed ? '✓' : ''}</div>
      <div class="task-body">
        <div class="task-text" data-action="toggle">${this._esc(t.description)}</div>
        <div class="task-time">🕐 ${ts}</div>
      </div>
      <div class="task-actions">
        <div class="btn-icon btn-edit" data-action="edit" title="Edit">✏️</div>
        <div class="btn-icon btn-delete" data-action="delete" title="Delete">🗑️</div>
      </div>
    </div>`;
  }

  _esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  showEditMode(id, currentText) {
    const el = this.listEl.querySelector(`[data-id="${id}"] .task-body`);
    if (!el) return;
    el.innerHTML = `
      <input class="task-edit-input" value="${this._esc(currentText)}" data-edit-id="${id}" />
      <div class="task-time">Press Enter or click 💾 to save</div>`;
    const item = this.listEl.querySelector(`[data-id="${id}"] .btn-edit`);
    if (item) { item.textContent = '💾'; item.classList.add('btn-save'); item.classList.remove('btn-edit'); }
    el.querySelector('input').focus();
  }

  getEditValue(id) {
    const inp = this.listEl.querySelector(`[data-edit-id="${id}"]`);
    return inp ? inp.value : null;
  }

  animateRemove(id, cb) {
    const el = this.listEl.querySelector(`[data-id="${id}"]`);
    if (el) {
      el.classList.add('removing');
      setTimeout(cb, 300);
    } else { cb(); }
  }

  updateStats(tasks) {
    const total   = tasks.length;
    const done    = tasks.filter(t => t.completed).length;
    const pending = total - done;
    const pct     = total ? Math.round((done / total) * 100) : 0;
    this.totalEl.textContent   = total;
    this.doneEl.textContent    = done;
    this.pendingEl.textContent = pending;
    this.pctEl.textContent     = pct + '%';
    this.progressEl.style.width = pct + '%';
  }

  setActiveFilter(f) {
    this.filterBtns.forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  }

  getInput()     { return this.inputEl.value; }
  clearInput()   { this.inputEl.value = ''; this.inputEl.focus(); }
  getSortValue() { return this.sortSel.value; }
}

// ============================================================
// CONTROLLER — wires Model + View + events
// ============================================================
class TaskController {
  constructor(model, view) {
    this.model     = model;
    this.view      = view;
    this.filter    = 'all';
    this.editingId = null;

    // Bind events
    this.view.addBtn.addEventListener('click',   () => this._addTask());
    this.view.inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') this._addTask(); });
    this.view.sortSel.addEventListener('change',  () => this._render());
    this.view.filterBtns.forEach(btn =>
      btn.addEventListener('click', () => {
        this.filter = btn.dataset.filter;
        this.view.setActiveFilter(this.filter);
        this._render();
      })
    );
    this.view.listEl.addEventListener('click', e => this._handleListClick(e));
    this.view.listEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.classList.contains('task-edit-input')) {
        const id = e.target.dataset.editId;
        if (id) this._saveEdit(id);
      }
    });

    this._render();
  }

  _addTask() {
    const text = this.view.getInput().trim();
    if (!text) { this.view.inputEl.focus(); return; }
    this.model.add(text);
    this.view.clearInput();
    this._render();
  }

  _handleListClick(e) {
    const btn  = e.target.closest('[data-action]');
    if (!btn) return;
    const item = btn.closest('[data-id]');
    if (!item) return;
    const id     = item.dataset.id;
    const action = btn.dataset.action;

    if (action === 'delete') {
      this.view.animateRemove(id, () => {
        this.model.remove(id);
        this._render();
      });
    } else if (action === 'toggle') {
      this.model.toggle(id);
      this._render();
    } else if (action === 'edit') {
      this.editingId = id;
      const task = this.model.tasks.find(t => t.id === id);
      if (task) this.view.showEditMode(id, task.description);
    } else if (btn.classList.contains('btn-save') || action === 'edit') {
      this._saveEdit(id);
    }
  }

  _saveEdit(id) {
    const val = this.view.getEditValue(id);
    if (val && val.trim()) {
      this.model.edit(id, val);
    }
    this.editingId = null;
    this._render();
  }

  _render() {
    const tasks    = this.model.tasks;
    const filtered = this.model.getFiltered(this.filter, this.view.getSortValue());
    this.view.renderList(filtered);
    this.view.updateStats(tasks);
  }
}

// ============================================================
// BOOTSTRAP
// ============================================================
const app = new TaskController(new TaskModel(), new TaskView());
</script>
</body>
</html>
